name: Publish new blog entry

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  discussions: write

concurrency:
  group: website-publication
  cancel-in-progress: false

jobs:
  publish-new-blog-entry:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: test
        run: node --test .github/scripts/*.test.cjs
      - name: find published posts
        env:
          POSTS_FILE: ${{ runner.temp }}/published-posts.json
        run: bash .github/scripts/published-posts.sh > "$POSTS_FILE"
      - name: create missing discussions
        uses: actions/github-script@v7
        env:
          POSTS_FILE: ${{ runner.temp }}/published-posts.json
        with:
          script: |
            const posts = JSON.parse(require('node:fs').readFileSync(process.env.POSTS_FILE, 'utf8'));
            await require('./.github/scripts/publish-new-blog-entry.cjs')({ github, context, posts });
      - name: commit discussion links
        run: |
          git add _articles _data/comments
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Link published blog posts to their GitHub discussions'
            git push origin HEAD:master
          fi
