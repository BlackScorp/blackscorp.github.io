name: publish

on:
  workflow_run:
    workflows: ['Publish new blog entry']
    types: [completed]
    branches: [master]
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: website-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: fetch comments
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/sync-comments.cjs')({ github, context });
      - name: commit
        shell: bash
        run: |
          git add _data/comments/*.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update blog comments and replies from GitHub Discussions'
            git push origin HEAD:master
          fi
      - name: configure
        uses: actions/configure-pages@v5
      - name: build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: upload
        uses: actions/upload-pages-artifact@v3
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
