title: Vitalij Mik
description: Persönliche Webseite und Blog
profile_image: ""
contact_email: "vitalij.mik@proton.me"
social:
  github: "https://github.com/BlackScorp"
  linkedin: "https://www.linkedin.com/in/vitalij-mik-153895a2/"
  youtube: "https://www.youtube.com/vitalijmik"
lang: de
url: "https://blackscorp.github.io"
repository: BlackScorp/blackscorp.github.io
baseurl: ""
markdown: kramdown
collections:
  articles:
    output: true
    permalink: /blog/:path
plugins:
  - jekyll-sitemap
include:
  - _pages
defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: post
      published: false
exclude:
  - jekyll
  - scripts
  - Makefile
  - README.md
  - AGENTS.md
